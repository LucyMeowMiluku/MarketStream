[project]
name = "marketstream"
version = "0.1.0"
description = "Multi-Source Streaming Analytics Platform for Financial Trends and Anomaly Detection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.6",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "streamlit>=1.37",
    "plotly>=5.20",
    "pydantic-settings>=2.4",
    "structlog>=24.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17.0",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
